services:
  - type: web
    name: ai-missing-person-finder-backend
    env: python
    plan: starter
    buildCommand: |
      pip install -r requirements.txt
      python -c "import deepface; deepface.build_model('Facenet')"
    startCommand: python app.py
    envVars:
      - key: MONGO_URI
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: FROM_EMAIL
        value: noreply@missingpersonfinder.com
      - key: FROM_NAME
        value: AI Missing Person Finder
      - key: HIGH_CONFIDENCE_THRESHOLD
        value: "0.9"
      - key: NOTIFICATION_ENABLED
        value: "true"
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.9.16"
